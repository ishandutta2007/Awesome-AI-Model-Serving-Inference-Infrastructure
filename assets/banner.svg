<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#10192d" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 15s ease-in-out infinite alternate;
      }
      .orb-3 {
        animation: floatOrb3 10s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: dashStream 20s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 6 12;
        animation: dashStreamRev 15s linear infinite;
      }
      .pulse-pill {
        animation: pillPulse 4s ease-in-out infinite alternate;
      }
      .pulse-node {
        animation: nodePulse 3s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(80px, 40px) scale(1.2); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-70px, -50px) scale(1.15); }
      }
      @keyframes floatOrb3 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(50px, -30px) scale(0.9); }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dashStreamRev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes pillPulse {
        0% { opacity: 0.7; transform: translateY(0); }
        100% { opacity: 0.95; transform: translateY(-3px); }
      }
      @keyframes nodePulse {
        0% { r: 4px; opacity: 0.4; }
        100% { r: 7px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />

  <!-- Animated Glowing Orbs (Deep in Background) -->
  <g opacity="0.35">
    <circle class="orb-1" cx="200" cy="120" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#glow)" />
    <circle class="orb-3" cx="600" cy="80" r="110" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Circuit/Data Stream Lines -->
  <g opacity="0.3">
    <path class="stream-line" d="M-50,80 Q 300,140 600,60 T 1250,90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line-rev" d="M-50,340 Q 400,260 750,360 T 1250,330" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="stream-line" d="M 150,450 Q 500,320 850,420 T 1250,220" fill="none" stroke="#3b82f6" stroke-width="1.5" />
    <path class="stream-line-rev" d="M-50,200 Q 350,110 900,230 T 1250,140" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Animated Stream Nodes -->
  <circle class="pulse-node" cx="300" cy="140" r="5" fill="#38bdf8" />
  <circle class="pulse-node" cx="600" cy="60" r="5" fill="#818cf8" />
  <circle class="pulse-node" cx="950" cy="100" r="5" fill="#c084fc" />
  <circle class="pulse-node" cx="400" cy="260" r="5" fill="#38bdf8" />
  <circle class="pulse-node" cx="750" cy="360" r="5" fill="#a855f7" />

  <!-- Subtle Ambient Glow Plate Behind Forefront Title -->
  <rect x="180" y="55" width="840" height="190" rx="20" fill="rgba(10, 15, 30, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Forefront Title & Branding (Always Crisp and in Foreground) -->
  <g text-anchor="middle">
    <!-- Super-header / Topic Pill -->
    <rect x="420" y="75" width="360" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="600" y="96" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">
      ⚡ PRODUCTION AI INFERENCE ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="160" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome AI Model Serving
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      High-Throughput LLM Serving Engines • Distributed Inference • Low-Latency Runtimes
    </text>
  </g>

  <!-- Interactive / Modern Architecture Feature Pills (Lower Foreground) -->
  <g class="pulse-pill" transform="translate(150, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="58" rx="12" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="28" cy="29" r="14" fill="rgba(56, 189, 248, 0.15)" />
      <text x="28" y="34" text-anchor="middle" font-size="14">🚀</text>
      <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">vLLM &amp; SGLang</text>
      <text x="52" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Paged &amp; Radix Attention</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(230, 0)">
      <rect width="215" height="58" rx="12" fill="url(#card-grad)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1" />
      <circle cx="28" cy="29" r="14" fill="rgba(129, 140, 248, 0.15)" />
      <text x="28" y="34" text-anchor="middle" font-size="14">⚙️</text>
      <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">TensorRT-LLM &amp; Triton</text>
      <text x="52" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">GPU Kernel Optimization</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(470, 0)">
      <rect width="205" height="58" rx="12" fill="url(#card-grad)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1" />
      <circle cx="28" cy="29" r="14" fill="rgba(168, 85, 247, 0.15)" />
      <text x="28" y="34" text-anchor="middle" font-size="14">⚡</text>
      <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">llama.cpp &amp; Ollama</text>
      <text x="52" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Quantized Local Runtimes</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(700, 0)">
      <rect width="200" height="58" rx="12" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="28" cy="29" r="14" fill="rgba(56, 189, 248, 0.15)" />
      <text x="28" y="34" text-anchor="middle" font-size="14">☁️</text>
      <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Groq, Modal &amp; Cerebras</text>
      <text x="52" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">High-Speed Cloud Inference</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="419" x2="1200" y2="419" stroke="url(#primary-glow)" stroke-width="2" />
</svg>
